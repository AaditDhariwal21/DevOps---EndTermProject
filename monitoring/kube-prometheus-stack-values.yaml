# kube-prometheus-stack (Prometheus Operator + Prometheus + Grafana +
# kube-state-metrics + node-exporter), tuned for a small classroom cluster.
#
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --version 92.9.0 -n monitoring --create-namespace \
#     -f monitoring/kube-prometheus-stack-values.yaml \
#     --set grafana.adminPassword='<choose-one>'

# Not needed for the demo; saves a pod and memory.
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from *any* release/namespace (e.g. the DeskFlow
    # chart's), not only those labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 2d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi

grafana:
  # Override on the command line; never commit a real password.
  adminPassword: change-me
  defaultDashboardsTimezone: browser
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      # Load every ConfigMap labelled grafana_dashboard=1 in any namespace —
      # this is how the DeskFlow chart ships its dashboard.
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# Control-plane components are managed by EKS and not scrapeable; disabling
# them keeps the Prometheus Targets page free of permanently-DOWN targets.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
