{{- $fullname := include "deskflow.fullname" . -}}
{{- $port := int .Values.frontend.port -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "deskflow.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "deskflow.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "deskflow.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "deskflow.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deskflow.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 101   # "nginx" user of nginx-unprivileged
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "deskflow.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
          env:
            # Nginx proxies /api here when the UI is reached without the Ingress
            # (e.g. kubectl port-forward). With the Ingress, /api never hits Nginx.
            - name: BACKEND_URL
              value: "http://{{ $fullname }}-backend:{{ .Values.backend.port }}"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "deskflow.containerSecurityContext" . | nindent 12 }}
          # Read-only root FS: Nginx only writes its rendered config, pid and cache files.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "deskflow.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 20 }}
