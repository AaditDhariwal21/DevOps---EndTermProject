{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secretName := include "deskflow.postgresql.fullname" . }}
{{- /* Reuse the password already in the cluster so upgrades never rotate it underneath Postgres. */}}
{{- $password := .Values.postgresql.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "deskflow.componentLabels" (dict "ctx" $ "component" "database") | nindent 4 }}
  annotations:
    # Never delete the DB password on `helm uninstall` while the PVC still exists.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
