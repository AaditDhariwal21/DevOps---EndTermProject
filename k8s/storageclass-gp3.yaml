# EKS only. Since Kubernetes 1.30, EKS no longer marks the legacy gp2 class as
# default, so PVCs (PostgreSQL) would stay Pending without this.
# Uses the aws-ebs-csi-driver add-on installed by Terraform.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
# Create the volume in the AZ where the Pod is actually scheduled.
volumeBindingMode: WaitForFirstConsumer
