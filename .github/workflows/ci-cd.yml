# DeskFlow CI/CD
#
#   TEST ──────────────► BUILD + SCAN + PUSH ──────────► DEPLOY
#   backend: ruff,        docker build (both images)      helm upgrade --install
#   pytest, migrations    Trivy: fail on HIGH/CRITICAL    on EKS (main only,
#   frontend: npm build   push ghcr.io/...:<git sha>      when DEPLOY_ENABLED)
#   repo: secret scan
#
# Pull requests run TEST + BUILD + SCAN but never push or deploy.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a main-branch deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Pinned to a known-good release. trivy-action tags and Trivy v0.69.4 were
  # compromised in March 2026 (CVE-2026-33634), so we run the official image directly.
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  PUSH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------- TEST
  backend-test:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Real PostgreSQL, used only to prove the Alembic migrations apply and roll back.
      # The pytest suite itself runs against an isolated in-memory SQLite DB.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deskflow
          POSTGRES_PASSWORD: deskflow
          POSTGRES_DB: deskflow_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskflow" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (pytest)
        run: pytest -v --cov=app --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Verify migrations (upgrade → downgrade → upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://deskflow:deskflow@localhost:5432/deskflow_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_GIT_SHA: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  repo-scan:
    name: Repo · secret + IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (blocking)
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" fs --quiet \
            --scanners secret --exit-code 1 /repo

      - name: Misconfiguration scan — Dockerfiles, Helm, Terraform (report only)
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" fs --quiet \
            --scanners misconfig --severity HIGH,CRITICAL --exit-code 0 /repo

  # ---------------------------------------------------- BUILD + SCAN + PUSH
  build-scan-push:
    name: Image · ${{ matrix.component }}
    needs: [backend-test, frontend-build, repo-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        run: |
          # GHCR requires a lowercase owner.
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskflow-${{ matrix.component }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.ref }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy report (all severities, informational)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --format table --exit-code 0 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            "${{ steps.meta.outputs.ref }}" | tee trivy-report.txt
          {
            echo "### Trivy — deskflow-${{ matrix.component }}"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy gate (fail on HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.meta.outputs.ref }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-report.txt

      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.PUSH_IMAGES == 'true'
        run: |
          docker push "${{ steps.meta.outputs.ref }}"
          echo "Pushed \`${{ steps.meta.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- DEPLOY
  # Enabled by setting repository variable DEPLOY_ENABLED=true once the EKS
  # cluster exists (see README → "Continuous deployment"). Uses GitHub OIDC,
  # so no long-lived AWS keys are stored in GitHub.
  deploy:
    name: Deploy · EKS (Helm)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.url.outputs.app_url }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'deskflow-eks' }}
      NAMESPACE: deskflow
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: helm upgrade --install
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install deskflow ./helm/deskflow \
            --namespace "$NAMESPACE" --create-namespace \
            -f helm/deskflow/values-eks.yaml \
            --set backend.image.repository="${REGISTRY}/${owner}/deskflow-backend" \
            --set backend.image.tag="${GITHUB_SHA}" \
            --set frontend.image.repository="${REGISTRY}/${owner}/deskflow-frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --atomic --wait --timeout 10m

      - name: Verify rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/deskflow-backend --timeout=3m
          kubectl -n "$NAMESPACE" rollout status deploy/deskflow-frontend --timeout=3m
          kubectl -n "$NAMESPACE" get pods,svc,ingress,hpa
          helm history deskflow -n "$NAMESPACE" --max 5

      - name: Smoke test through the Ingress
        id: url
        run: |
          host=$(kubectl -n ingress get svc traefik -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "app_url=http://${host}" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            sha=$(curl -fsS "http://${host}/api/system" | python3 -c 'import json,sys; print(json.load(sys.stdin)["git_sha"])') && break
            sleep 10
          done
          echo "Live backend SHA: ${sha}"
          test "${sha}" = "${GITHUB_SHA}"
          echo "Deployed **${GITHUB_SHA}** → http://${host}" >> "$GITHUB_STEP_SUMMARY"
