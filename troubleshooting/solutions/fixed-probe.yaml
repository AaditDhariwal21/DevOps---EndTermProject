# LAB 3 — solution: readiness probe targets the port the container listens on.
#   kubectl apply -f troubleshooting/solutions/fixed-probe.yaml
#   kubectl get pods -n deskflow-lab -l app=lab-probe   → READY 1/1
apiVersion: v1
kind: Namespace
metadata:
  name: deskflow-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-probe
  namespace: deskflow-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-probe
  template:
    metadata:
      labels:
        app: lab-probe
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              # FIXED: probe the named container port (8080).
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lab-probe
  namespace: deskflow-lab
spec:
  selector:
    app: lab-probe
  ports:
    - port: 80
      targetPort: http
